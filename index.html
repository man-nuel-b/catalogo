<!DOCTYPE html>
<html lang="es">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .card-hover { transition: all 0.25s ease-in-out; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>

  <!-- Header -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <span class="text-xl font-extrabold tracking-tight text-gray-900">BOUTIQUE & CARTERAS</span>
      
      <!-- Botón Abrir Carrito -->
      <button onclick="toggleCartModal()" class="relative bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 transition-colors shadow-sm">
        <i class="fas fa-shopping-bag text-sm"></i>
        <span>Mi Pedido</span>
        <span id="cart-badge" class="bg-white text-emerald-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-white border-b border-gray-200 py-8 md:py-12 text-center">
    <div class="max-w-3xl mx-auto px-4">
      <span class="text-xs font-bold uppercase tracking-widest text-emerald-600 mb-2 block">Colección Exclusiva</span>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight mb-2">Catálogo de Carteras</h1>
      <p class="text-gray-500 text-xs sm:text-sm">Elige tus carteras o accesorios favoritos, añádelos al pedido y envía tu compra directamente a nuestro WhatsApp.</p>
    </div>
  </section>

    <div class="flex items-center justify-between gap-4 mb-8">
      <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1"></div>
