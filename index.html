<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5f0">
  <meta name="description" content="Descubre nuestra colección de carteras y accesorios. Elige tus favoritos y realiza tu pedido por WhatsApp.">
  <title>Maison Carteras | Boutique online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --ink:#24221f; --muted:#77716a; --paper:#faf8f4; --white:#fff;
      --accent:#8b6b4a; --accent-dark:#6f5237; --line:#e9e2d9;
      --soft:#f1ebe3; --green:#247a50; --danger:#a33c35;
      --shadow:0 14px 38px rgba(43,34,25,.08); --radius:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .announcement{background:var(--ink);color:#f9f5ee;text-align:center;padding:9px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
    .header{position:sticky;top:0;z-index:30;background:rgba(250,248,244,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(233,226,217,.9)}
    .nav{max-width:1240px;margin:auto;min-height:78px;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:11px;min-width:190px}
    .brand-mark{width:39px;height:39px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-family:"Playfair Display",serif;font-size:21px}
    .brand-name{font-family:"Playfair Display",serif;font-size:20px;letter-spacing:.04em;line-height:1.1}
    .brand-sub{display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:5px}
    .nav-links{display:flex;gap:25px;font-size:12px;color:#5c554e}
    .nav-links a:hover{color:var(--accent)}
    .cart-open{border:1px solid var(--ink);background:var(--ink);color:white;border-radius:99px;padding:12px 17px;display:flex;align-items:center;gap:10px;font-size:12px;transition:.2s}
    .cart-open:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
    .badge{background:#fff;color:var(--ink);border-radius:50%;width:21px;height:21px;display:grid;place-items:center;font-size:10px;font-weight:700}
    .hero{max-width:1240px;margin:0 auto;padding:54px 26px 36px;display:grid;grid-template-columns:1fr .88fr;gap:48px;align-items:center}
    .eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:10px}
    .eyebrow:before{content:"";width:27px;height:1px;background:var(--accent)}
    h1,h2,h3,p{margin-top:0}
    h1{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(42px,5.4vw,72px);line-height:1.03;letter-spacing:-.035em;margin:20px 0}
    h1 em{color:var(--accent);font-weight:500}
    .hero-copy{font-size:14px;line-height:1.9;color:var(--muted);max-width:450px;margin-bottom:27px}
    .primary-link{display:inline-flex;align-items:center;gap:11px;background:var(--accent);color:white;padding:14px 20px;border-radius:3px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;transition:.2s}
    .primary-link:hover{background:var(--accent-dark);transform:translateY(-1px)}
    .hero-note{font-size:10px;color:var(--muted);margin-top:20px;display:flex;gap:18px;flex-wrap:wrap}
    .hero-note span{display:flex;gap:7px;align-items:center}
    .hero-note i{color:var(--accent)}
    .hero-image{min-height:380px;height:clamp(380px,43vw,540px);position:relative;background:#e9ded0;overflow:hidden}
    .hero-image img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-image:after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.65);pointer-events:none}
    .hero-tag{position:absolute;z-index:1;bottom:27px;left:27px;background:rgba(250,248,244,.94);padding:13px 17px;font-family:"Playfair Display",serif;font-size:17px}
    .hero-tag small{display:block;font-family:"DM Sans",sans-serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:4px}
    .benefits{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#f4f0e9}
    .benefit-row{max-width:1240px;margin:auto;padding:18px 26px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .benefit{display:flex;justify-content:center;align-items:center;gap:11px;font-size:11px;color:#5d554d}
    .benefit i{font-size:16px;color:var(--accent)}
    .catalog{max-width:1240px;margin:auto;padding:76px 26px 90px}
    .section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:29px}
    .section-heading h2{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(30px,4vw,43px);margin:12px 0 0}
    .section-heading p{font-size:12px;color:var(--muted);margin:0 0 5px}
    .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:24px}
    .search-wrap{position:relative;flex:1;max-width:410px}
    .search-wrap i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#8e867e;font-size:13px}
    .search-wrap input{width:100%;border:1px solid var(--line);background:#fff;padding:13px 15px 13px 40px;outline:none;border-radius:4px;font-size:12px}
    .search-wrap input:focus{border-color:var(--accent)}
    .sort-select{border:1px solid var(--line);background:#fff;padding:13px 35px 13px 13px;border-radius:4px;color:#5d554d;font-size:12px;outline:none}
    .categories{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
    .category-btn{background:transparent;border:1px solid var(--line);color:#6f675e;border-radius:99px;padding:9px 15px;font-size:11px;transition:.2s}
    .category-btn:hover,.category-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .catalog-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:11px;color:var(--muted)}
    .product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 22px}
    .product-card{background:#fff;min-width:0;border:1px solid #eee8e0;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
    .product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .product-image{height:330px;background:#f0ebe4;position:relative;overflow:hidden}
    .product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
    .product-card:hover .product-image img{transform:scale(1.04)}
    .product-category{position:absolute;top:14px;left:14px;background:rgba(250,248,244,.94);color:#625548;padding:7px 10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .product-info{padding:18px 18px 16px;display:flex;flex-direction:column;flex:1}
    .product-title{font-family:"Playfair Display",serif;font-size:19px;font-weight:500;margin:0 0 8px}
    .product-description{font-size:11px;color:var(--muted);line-height:1.7;margin:0;min-height:38px}
    .product-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:15px;border-top:1px solid #f0ebe5}
    .price-label{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#91877d;margin-bottom:5px}
    .product-price{font-size:15px;font-weight:700}
    .add-btn{background:var(--ink);color:white;border:0;padding:11px 13px;border-radius:3px;font-size:10px;display:flex;align-items:center;gap:8px;transition:.2s;white-space:nowrap}
    .add-btn:hover{background:var(--accent)}
    .empty-state{grid-column:1/-1;text-align:center;padding:65px 20px;background:white;border:1px solid var(--line);color:var(--muted)}
    .empty-state i{font-size:27px;color:var(--accent);margin-bottom:15px}
    .empty-state h3{font-family:"Playfair Display",serif;color:var(--ink);font-size:24px;font-weight:500;margin-bottom:8px}
    .loader{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px}
    .spinner{width:27px;height:27px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 13px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .footer{background:#25231f;color:#f5f0e8;padding:42px 26px 25px}
    .footer-inner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:25px;align-items:center}
    .footer .brand-name{font-size:19px}
    .footer p{font-size:11px;color:#c0b7ab;line-height:1.8;margin:8px 0 0}
    .footer-bottom{max-width:1240px;margin:27px auto 0;border-top:1px solid #49443d;padding-top:17px;font-size:10px;color:#a69d91;display:flex;justify-content:space-between;gap:12px}
    .whatsapp-float{position:fixed;bottom:22px;right:22px;z-index:20;background:#1f8e56;color:white;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 25px #0002;font-size:23px}
    .modal{position:fixed;inset:0;z-index:60;background:rgba(25,22,19,.5);display:flex;justify-content:flex-end;opacity:1;transition:opacity .2s}
    .modal.hidden{display:none}
    .cart-panel{width:min(100%,440px);height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-15px 0 45px #0001;animation:slidein .25s ease}
    @keyframes slidein{from{transform:translateX(30px);opacity:.7}to{transform:translateX(0);opacity:1}}
    .cart-header{display:flex;align-items:center;justify-content:space-between;padding:23px 24px;border-bottom:1px solid var(--line)}
    .cart-header h2{font-family:"Playfair Display",serif;font-size:24px;font-weight:500;margin:0}
    .close-btn{border:0;background:transparent;font-size:20px;color:var(--muted);padding:5px}
    .cart-items{padding:8px 24px;overflow-y:auto;flex:1}
    .cart-empty{text-align:center;color:var(--muted);padding:55px 10px;font-size:12px;line-height:1.8}
    .cart-empty i{font-size:27px;color:var(--accent);display:block;margin-bottom:14px}
    .cart-item{display:grid;grid-template-columns:74px 1fr auto;gap:13px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
    .cart-item img{width:74px;height:82px;object-fit:cover;background:#eee5da}
    .cart-item-name{font-family:"Playfair Display",serif;font-size:15px;margin-bottom:6px}
    .cart-item-price{font-size:11px;color:var(--accent);font-weight:700}
    .quantity-control{display:flex;align-items:center;gap:10px;margin-top:10px}
    .quantity-control button{border:1px solid var(--line);background:white;
